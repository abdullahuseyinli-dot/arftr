[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "human-activity-classification"
version = "3.1.0.dev0"
description = "Reproducible human activity classification benchmarks for still images and short clips"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "huggingface-hub>=0.28,<2",
  "imagehash>=4.3,<5",
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<6",
  "pandas>=2.2,<4",
  "pillow>=11,<13",
  "grad-cam>=1.5,<2",
  "scikit-learn>=1.6,<2",
  "scipy>=1.14,<2",
  "seaborn>=0.13,<1",
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",
  "tqdm>=4.66,<5",
  "transformers>=4.56,<6",
]

[project.optional-dependencies]
notebook = [
  "ipykernel>=6.29,<8",
  "jupyterlab>=4.3,<5",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
]
dev = ["pytest>=8.3,<10", "ruff==0.16.6"]
research = ["networkx>=3,<4"]
report = [
  "pdfplumber>=0.11,<1",
  "pypdf>=6,<7",
  "reportlab>=5,<6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["local_artifacts: integration checks requiring non-distributed historical run evidence"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"experiments/pipeline_source.ipynb" = [
  "E402",
  "F401",
  "F811",
  "F841",
  "I001",
  "UP015",
  "UP038",
]

[tool.ruff.format]
exclude = ["experiments/pipeline_source.ipynb"]
